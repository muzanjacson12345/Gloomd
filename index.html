<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101813">
  <meta name="description" content="GLOOMD — a self-contained living-world simulation.">
  <title>GLOOMD — A living world</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="worldMap" aria-label="Full-screen GLOOMD world map"></canvas>

  <header class="top-hud">
    <div class="brand-pill">
      <span class="brand">GLOOMD<span class="registered">®</span></span>
      <span class="eyebrow">WORLD OBSERVER</span>
    </div>
    <div class="world-pill">
      <span id="tickCount">TICK 0</span>
      <span class="separator">·</span>
      <span id="population">0 GLOOMS</span>
      <span class="separator">·</span>
      <span class="berry-total">BERRIES <b id="berryCount">0</b></span>
    </div>
    <div class="live-status"><i id="liveDot"></i><span id="runState">PAUSED</span></div>
  </header>

  <nav class="map-tools" aria-label="Map controls">
    <button id="zoomInBtn" class="tool-button" aria-label="Zoom in" title="Zoom in">+</button>
    <button id="zoomOutBtn" class="tool-button" aria-label="Zoom out" title="Zoom out">−</button>
    <button id="centerMapBtn" class="tool-button center-button" aria-label="Center map" title="Center map">◎</button>
  </nav>

  <div class="map-hint" id="mapHint">Tap two land tiles to place your first Glooms · drag to explore</div>

  <section class="inspect-panel" id="inspectPanel" hidden aria-live="polite">
    <div class="sheet-grabber"></div>
    <div class="inspect-heading">
      <div>
        <div class="eyebrow" id="inspectType">CREATURE DETAILS</div>
        <h2 id="selectedName">No Gloom selected</h2>
      </div>
      <button id="closeInspectBtn" class="close-button" aria-label="Close details">×</button>
    </div>
    <p id="selectedDetails" class="inspect-copy">Tap a Gloom or berry bush on the map to inspect it.</p>
    <div id="selectedStats" class="stats-grid"></div>
  </section>

  <section class="log-panel" id="logPanel" hidden>
    <div class="log-heading">
      <span class="eyebrow">WORLD OBSERVATIONS</span>
      <button id="closeLogBtn" class="close-button" aria-label="Close observations">×</button>
    </div>
    <div id="eventLog" class="event-log"><p>The world is waiting to begin.</p></div>
  </section>

  <div class="bottom-dock">
    <button class="primary action-button" id="startBtn" disabled><span class="button-icon">▶</span><span>Start</span></button>
    <button class="action-button" id="stepBtn" disabled><span class="button-icon">＋</span><span>1 tick</span></button>
    <button class="action-button" id="randomBtn"><span class="button-icon">✣</span><span>Random</span></button>
    <button class="action-button quiet" id="resetBtn"><span class="button-icon">↻</span><span>New world</span></button>
    <button class="action-button log-button" id="logBtn"><span class="button-icon">☷</span><span>Log</span></button>
  </div>

  <div class="hidden-data" aria-hidden="true">
    <span id="populationBig">0</span><span id="tickSide">0</span>
    <span id="selectedNameFallback"></span><p id="helpText"></p>
  </div>
  <script src="src/main.js"></script>
</body>
</html>
