name: GLOOMD — Restore the tested build after branch publishing

on:
  # GitHub's legacy branch publisher currently runs alongside our Vite workflow.
  # Re-publish the tested Vite artifact after that branch build completes so
  # the raw TypeScript source index can never be the final deployed page.
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Use the same deployment lock as deploy.yml so this recovery deploy is last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  restore:
    name: Rebuild and publish the real GLOOMD app
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify the world before publishing
        run: npm run test && npm run typecheck

      - name: Build the self-contained app
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the tested site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

      - name: Publish GLOOMD after the branch build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
